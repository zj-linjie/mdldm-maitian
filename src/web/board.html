function salesPeriods(s) {
  return `<div class="sales-periods">${[['today', '当天'], ['week', '近 7 天'], ['month', '近 30 天']].map(([key, label]) => {
    const p = s.periods?.[key] || {};

  }).join('')}</div>`;
}
function salesOrders(s, limit) {
  const orders = (s.recentOrders || []).slice(0, limit);
  return `${s.ordersError ? `<p class="sales-error" role="status">${esc(s.ordersError)}</p>` : ''}${orders.length ? `<ol class="sales-orders">${orders.map(o => `<li data-sales-order="${esc(o.id)}"><div class="sales-order-title" title="${esc(o.title)}">${esc(o.title)}</div><b>${salesMoney(o.amount)}</b><time>${esc(o.time?.slice(5, 16) || '–')}</time><span class="sales-state ${['paid','pending','closed','refunded','refunding','partial_refund'].includes(o.kind) ? o.kind : ''}">${esc(o.status)}</span></li>`).join('')}</ol>` : `<div class="sales-empty">${s.ordersSyncedAt ? '暂无订单' : '订单未同步'}</div>`}`;
}
function salesChart(rows) {
  const data = (rows || []).slice(-30), max = niceMax(Math.max(1, ...data.map(r => r.revenue || 0))), w = 640, L = 52, R = 8, T = 12, B = 24, h = 164, band = (w - L - R) / Math.max(1, data.length), y = v => T + (h - T - B) * (1 - v / max);
  if (!data.length) return '<div class="sales-empty">趋势未同步</div>';
  return `<svg class="sales-chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="近 30 天支付金额趋势">${[0, max / 2, max].map(v => `<line x1="${L}" x2="${w-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${v >= 10000 ? v / 10000 + '万' : fmt(v)}</text>`).join('')}${data.map((r, i) => {
    const valid = r.revenue != null && Number.isFinite(r.revenue), x = L + i * band + band * .18;
    return `${valid ? `<rect x="${x.toFixed(1)}" y="${y(r.revenue).toFixed(1)}" width="${(band*.64).toFixed(1)}" height="${Math.max(r.revenue > 0 ? 1 : 0, y(0)-y(r.revenue)).toFixed(1)}" rx="2" opacity="${r.provisional ? '.5' : i >= data.length-7 ? '1' : '.35'}"><title>${esc(r.day)} ${salesMoney(r.revenue)}${r.provisional ? ' 进行中' : ''}</title></rect>` : ''}${i === 0 || i === data.length-1 || (i % 7 === 0 && data.length-1-i >= 3) ? `<text x="${(x+band*.32).toFixed(1)}" y="${h-5}" text-anchor="${i === data.length-1 ? 'end' : 'middle'}">${esc(r.day.slice(5))}</text>` : ''}`;
  }).join('')}</svg>`;
}
let salesSyncing = false, salesPoll = null, salesSyncMessage = '';
function salesDashboard() {
  const s = O.site.sales;
  if (!s) return salesStrip(O.site.days);
  const busy = salesSyncing || (O.actions || []).some(a => a.type === 'board' && !a.done);
  return `<section class="panel sales-dashboard" aria-label="${esc(PN.zsz)}销售"><header class="sales-header"><h3>${esc(PN.zsz)}</h3><time>更新 ${esc(salesUpdated(s.syncedAt))}</time><div class="sales-controls"><button type="button" class="btn" data-sales-sync aria-label="同步小鹅通数据" ${busy ? 'disabled' : ''}>${busy ? '同步中…' : '同步'}</button><a href="/p#/convert">销售详情 ›</a></div></header>${salesPeriods(s)}
  ${(s.error || salesSyncMessage) ? `<p class="sales-error" role="status">${esc(s.error || salesSyncMessage)}</p>` : ''}<div class="sales-bottom"><div class="sales-trend"><h4>近 30 天支付金额</h4>${salesChart(s.trend)}</div><div class="sales-activity"><h4>订单动态 <time>${esc(salesUpdated(s.ordersSyncedAt))}</time></h4>${salesOrders(s, 5)}</div></div></section>`;
}
async function syncSales() {
  if (salesSyncing) return;
  const started = Date.now(), previous = new Set((O.actions || []).filter(a => a.type === 'board').map(a => a.startedAt));
  salesSyncing = true; salesSyncMessage = ''; render();
  try {
    const r = await fetch('/api/action', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ type: 'board' }) });
    const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || '同步失败');
    await load();
    const check = () => {
      const a = (O.actions || []).find(a => a.type === 'board' && a.startedAt && !previous.has(a.startedAt));
      if ((!a || !a.done) && Date.now() - started <= 120000) return false;
      if (!a || !a.done) { salesSyncing = false; salesSyncMessage = '同步等待超时，请稍后刷新'; clearInterval(salesPoll); salesPoll = null; render(); return true; }
      salesSyncing = false; salesSyncMessage = a.ok === false ? '同步失败，请查看系统记录' : ''; clearInterval(salesPoll); salesPoll = null; render(); return true;
    };
    if (!check()) salesPoll = setInterval(async () => { await load(); check(); }, 2000);
  } catch (e) { salesSyncing = false; salesSyncMessage = e.message; render(); }
}
document.addEventListener('click', e => { if (e.target.closest('[data-sales-sync]')) syncSales(); });

function loginLight(h) {
  const ps = (h.platforms || []).filter(p => !p.disabled);
  const bad = ps.filter(p => p.state && p.state !== 'ok').length, none = !ps.length || ps.every(p => !p.state);
  if (bad) return ['bad', `平台登录 ${bad} 家掉线`];
  if (none) return ['warn', '平台登录 还没检'];
  return ['ok', '平台登录 正常'];
}
function render() {

  if (!SL.length && eps[0]) SL = [eps[0]];
  if (HI == null || !SL[HI] || SL[HI].id !== HID) { const live = SL.filter(e => at(e) <= now); HI = live.length ? SL.indexOf(live[live.length - 1]) : 0; }
  const cur = SL[HI] || eps[0], ref = eps.find(e => e.views > 50) || null;
  const prevOf = (e) => eps.filter(x => x !== e && x.views > 50 && at(x) < at(e)).sort((a, b) => at(b) - at(a))[0] || eps.find(x => x !== e && x.views > 50) || null;
  const prev = prevOf(cur); PREVOF = prevOf; HID = cur && cur.id;
  const today = new Date().toLocaleDateString('zh-CN');
  const [lc, lt] = loginLight(h);
  const fansTotal = FANP.reduce((s, p) => s + (latest(p) || 0), 0);
  const g1 = FANP.map(p => gainN(p, 1)).filter(v => v != null), g7 = FANP.map(p => gainN(p, 7)).filter(v => v != null), g30 = FANP.map(p => gainN(p, 30)).filter(v => v != null);
  const cover7 = FANP.filter(p => gainN(p, 7) != null), noHist = FANP.filter(p => gainN(p, 1) == null);
  const marks = Object.fromEntries(eps.filter(e => e.schedule).map(e => [e.schedule.slice(0, 10), e.nick]));
  const fanRows = FANP.map(p => ({ p, raw: latest(p) })).sort((a, b) => (b.raw ?? -1) - (a.raw ?? -1));
  const fSum = fanRows.reduce((s, x) => s + (x.raw || 0), 0);
  const compSegs = fanRows.filter(x => x.raw > 0).map(x => `<i style="flex:${x.raw} 1 0;background:var(--p-${x.p})" data-tip="${PN[x.p]} ${fmt(x.raw)} · 占 ${fSum ? (x.raw / fSum * 100).toFixed(1) : 0}%"></i>`).join('');
  const compLegend = fanRows.map(x => `<span class="cl${x.raw != null ? '' : ' zero'}"><i class="dot" style="background:var(--p-${x.p})"></i>${PN[x.p]}<b>${x.raw == null ? '–' : fmt(x.raw)}</b><small>${x.raw == null ? '无记录' : fSum ? (x.raw / fSum * 100).toFixed(1) + '%' : '0.0%'}</small></span>`).join('');
  const l7 = days.slice(-7);
  let hero = '<div class="empty">还没有登记的期数</div>';
  if (cur) hero = heroHTML(cur, prevOf(cur));
  const card = (p) => {
    const tot = latest(p), a = gainN(p, 1), b = gainN(p, 7), tc = task(cur, p), mc = M(cur, p), mr = M(prev || ref, p), on = tc && tc.state === 'published';
    const sp = sparkLine(p);
    return `<div class="panel pc" style="--c:var(--p-${p})"><div class="nm">${logo(p)}${PN[p]}<small>${FAN_WORD[p] || '粉丝'}</small></div>
      <div class="val">${kfmt(tot)}</div><div class="gl">${gp('今日', a)}${gp('7 天', b)}${a == null && b == null ? '<span class="gpill">今天开始记录</span>' : ''}</div>
      <div class="sp">${sp}</div>
      <div class="ft"><div><span title="${cur ? esc(cur.name) : ''}">${cur ? esc(cur.nick) : '本期'}</span><b>${on && mc ? fmt(mc.views) : tc ? esc(tc.stateCn) : '–'}</b></div><div>${prev || ref ? `<span title="${esc((prev || ref).name)}">${esc((prev || ref).nick)}</span>` : '上期'}<b>${mr ? fmt(mr.views) : '–'}${mr && mr.views >= 50 ? `<span style="display:block;font-weight:400;font-size:11.5px;color:var(--t3)">互动率 ${pct(inter(mr), mr.views, 1)}</span>` : ''}</b></div></div></div>`;
  };
  const f0 = O.feed[0], browser = h.browser || { name: '专用浏览器', ok: h.chrome, status: h.chrome ? '在线' : '没开' };
  $('#screen').innerHTML = `
  <div class="top"><div class="logo">麦田</div><div class="tag">内容与粉丝监控</div>
    <div class="nav"><a class="on" href="/">大屏</a><a href="/p#/traffic">流量</a><a href="/p#/calendar">日历</a><a href="/p#/convert">${O.siteSalesOnly ? '销售' : '转化'}</a><a href="/p#/archive">档案</a><a href="/p#/system">系统</a></div>
    <div class="lights"><span class="light ok">守护进程 运行中</span><span class="light ${h.nas ? 'ok' : 'bad'}">NAS ${h.nas ? '已挂载' : '读不到'}</span><span class="light ${browser.ok ? 'ok' : 'bad'}">${esc(browser.name)} ${esc(browser.status)}</span>
      <span class="light ${lc}">${lt}</span></div>
    <div class="clock" id="clock"></div></div>

  <div class="r1">
    <div class="panel hero" id="hero">${hero}</div>
    <div class="panel fans"><div class="ph"><h3>粉丝</h3><span class="note">${FANP.length} 个平台合计，不含知识站</span></div>
      <div class="headline"><div class="val xl">${fmt(fansTotal)}</div><div class="g">${gp('今日', g1.length ? g1.reduce((a, b) => a + b, 0) : null)}${gp('近 7 天', g7.length ? g7.reduce((a, b) => a + b, 0) : null)}${gp('近 30 天', g30.length ? g30.reduce((a, b) => a + b, 0) : null)}</div></div>
      <div class="fans-comp"><div class="comp-bar">${compSegs || '<i></i>'}</div><div class="comp-legend">${compLegend}</div></div>
      <div class="ph" style="margin:8px 0 2px;flex-wrap:wrap;row-gap:2px"><h3 style="font-size:12px;color:var(--t2);font-weight:500;white-space:nowrap;flex:1 1 100%">粉丝走势 · 近 30 天（各平台堆叠）</h3><span class="note" style="flex:1 1 100%;text-align:left;font-size:9.5px;white-space:nowrap;overflow:hidden">${FANP.filter(p => gainN(p, 2) != null).map(p => `<i class="sw" style="width:7px;height:7px;margin:0 4px 0 8px;background:var(--p-${p})"></i>${PN[p]}`).join('')}</span></div>
      <div class="pb chart" id="c-fans"></div>
      <div class="cap"><span class="ht">${noHist.length ? `${noHist.map(p => PN[p]).join('、')}后台不给历史，从今天开始记；涨跌只统计${cover7.map(p => PN[p]).join('、') || '有历史的平台'}` : '全部平台都有记录'}</span></div></div>
    <div class="panel"><div class="ph"><h3>数据分析</h3><span class="note">按规则自动算，每天更新</span></div><div class="pb ins">${insights(cur, ref)}</div></div>
  </div>

  <div class="cards" style="--n:${PL.length}">${PL.map(card).join('')}</div>

  ${O.siteOn && O.siteSalesOnly ? salesDashboard() : ''}
  ${O.siteOn && !O.siteSalesOnly ? `  <a class="panel strip" href="/p#/convert"><h3>${esc(PN.zsz)} · 近 7 天</h3><span>新注册<b>${fmt(sum(l7, 'reg'))}</b></span><span>新会员<b>${fmt(sum(l7, 'vip'))}</b></span><span>订单<b>${fmt(sum(l7, 'orders'))}</b></span><span>收入<b>¥${fmt(sum(l7, 'revenue'))}</b></span>
    <span class="feedline">${f0 ? `最近动态：${pad(new Date(f0.ts).getHours())}:${pad(new Date(f0.ts).getMinutes())} ${f0.nick ? '「' + esc(f0.nick) + '」' : ''}${esc(f0.platform)} ${esc(f0.action)}${f0.result ? ' · ' + esc(f0.result) : ''}` : ''}</span><span class="go">转化详情 ›</span></a>` : ''}`;
  draw(); tick(); fixTabs(); const h0 = document.querySelector('.hero h2'), busy0 = fitH(); const dur0 = (h0 && parseFloat(getComputedStyle(h0).getPropertyValue('--dur'))) || 12; PAUSE = Date.now() + (busy0 ? Math.max(9000, dur0 * 1000 + 1500) : 9000); if (!render.done) { render.done = true; countUp(); }
}
function draw() { if (!O) return; const ins = document.querySelector('.ins'); if (ins && innerWidth > 1100) { [...ins.children].forEach(c => c.style.display = ''); for (let k = ins.children.length - 1; k > 0 && ins.scrollHeight > ins.clientHeight + 2; k--) ins.children[k].style.display = 'none'; } const el = $('#c-fans'); if (!el) return; drawFans(el, daysBack(30), Object.fromEntries(O.episodes.filter(e => e.schedule).map(e => [e.schedule.slice(0, 10), e.nick]))); }
function countUp() {
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  document.querySelectorAll('.val').forEach(el => {
    const m = el.textContent.match(/^(\D*)([\d,]+)(\D*)$/); if (!m) return; const to = +m[2].replace(/,/g, ''), t0 = performance.now();
    const step = (t) => { const k = Math.min(1, (t - t0) / 1100), e = 1 - Math.pow(1 - k, 4); el.textContent = m[1] + Math.round(to * e).toLocaleString('en-US') + m[3]; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function tick() {
  const n = new Date(), c = $('#clock'); if (!c) return;
  c.innerHTML = `<small>${n.getMonth() + 1}/${n.getDate()} 周${'日一二三四五六'[n.getDay()]}</small>${pad(n.getHours())}:${pad(n.getMinutes())}`;
  const cd = $('#cd'), cur = O && (SL[HI] || O.episodes[0]);
  if (cd && cur) {
    const s = cur.schedule ? Math.round((new Date(cur.schedule) - n) / 1000) : null, d = cur.schedule && new Date(cur.schedule), at = d ? `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}` : '';
    cd.textContent = s == null ? '' : s > 0 ? (s > 86400 ? `定时 ${at}，还有 ${Math.floor(s / 86400)} 天 ${Math.floor(s % 86400 / 3600)} 小时` : `定时 ${at}，还有 ${Math.floor(s / 3600)}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`) : -s < 3600 ? `${at} 发布，已发 ${Math.floor(-s / 60)} 分钟` : -s < 172800 ? `${at} 发布，已发 ${Math.floor(-s / 3600)} 小时` : `${at} 发布，已发 ${Math.floor(-s / 86400)} 天`;
  }
}
async function load() {

  catch (e) { if (!O) $('#screen').innerHTML = `<div class="empty">连不上麦田服务（${esc(e.message)}）</div>`; else console.error(e); }
}
const tip = $('#tip');
document.addEventListener('mousemove', (e) => { const t = e.target.closest && e.target.closest('[data-tip]'); if (!t) { tip.style.display = 'none'; return; } tip.textContent = t.dataset.tip; tip.style.display = 'block'; const w = tip.offsetWidth; tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + 'px'; tip.style.top = Math.max(8, e.clientY - 34) + 'px'; });
addEventListener('resize', () => { draw(); fitH(); });
if (matchMedia('(hover:hover)').matches) {
  let last = null;
  document.addEventListener('mousemove', (e) => {
    const hr = e.target.closest && e.target.closest('.hero');
    if (hr) { const r = hr.getBoundingClientRect(), cv = hr.querySelector('.cv'); if (cv) { cv.style.setProperty('--hy', (((e.clientX - r.left) / r.width - .5) * 22).toFixed(2) + 'deg'); cv.style.setProperty('--hx', ((.5 - (e.clientY - r.top) / r.height) * 14).toFixed(2) + 'deg'); } }
    else { const cv = document.querySelector('.hero .cv'); if (cv) { cv.style.setProperty('--hy', '0deg'); cv.style.setProperty('--hx', '0deg'); } }
    const el = e.target.closest && e.target.closest('.panel:not(.hero),.node');
    if (last && last !== el) { last.style.setProperty('--rx', '0deg'); last.style.setProperty('--ry', '0deg'); }
    last = el; if (!el) return;
    const r = el.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height, k = Math.min(1, 420 / r.width) * 2.2;
    el.style.setProperty('--mx', (x * 100).toFixed(1) + '%'); el.style.setProperty('--my', (y * 100).toFixed(1) + '%');
    el.style.setProperty('--ry', ((x - .5) * k).toFixed(2) + 'deg'); el.style.setProperty('--rx', ((.5 - y) * k).toFixed(2) + 'deg');
  });
}

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f5f7">
<title>麦田</title>
<meta name="apple-mobile-web-app-title" content="麦田">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="icon" href="/static/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/static/mt.css">

</head>
<body>
<div class="bgfx"><i></i><i></i><i></i></div>
<div class="page" id="app"><div class="empty" style="height:60vh">加载中…</div></div>
<script src="/static/mt.js"></script>
<script>
let S = null, settingsDirty = false;
let O = null, I = null, F = {}, timer = null, pick = null;
const toasted = new Set();
let doctorPrimed = false;
function doctorMsg(a, h) {
  if (!a.ok) { const err = String(a.tail || '').split('\n').map(s => s.trim()).filter(Boolean).slice(-1)[0]; return `体检失败${err ? '：' + err : ''}`; }
  const ps = (h.platforms || []).filter(p => !p.disabled && (!a.platform || p.id === a.platform));
  if (a.platform) {
    const p = (h.platforms || []).find(x => x.id === a.platform) || ps[0];
    if (!p) return `${PN[a.platform] || a.platform}：体检完成`;
    if (p.state === 'ok') return `${p.name || PN[p.id] || p.id}：已登录`;
    if (p.state === 'out') return `${p.name || PN[p.id] || p.id}：未登录${p.reason ? ' · ' + p.reason : ''}`;
    return `${p.name || PN[p.id] || p.id}：还没检查到状态`;
  }
  const ok = ps.filter(p => p.state === 'ok'), bad = ps.filter(p => p.state && p.state !== 'ok');
  if (!ps.length) return '体检完成';
  if (!bad.length) return `体检完成：${ok.length} 家全部已登录`;
  return `体检完成：${ok.length} 家正常，${bad.length} 家掉线（${bad.map(p => p.name || PN[p.id] || p.id).join('、')}）`;
}
function noteDoctorDone(h) {
  const docs = (O.actions || []).filter(x => x.type === 'doctor' && x.done && x.endedAt);
  if (!doctorPrimed) { for (const a of docs) toasted.add(`${a.startedAt}|${a.platform || ''}`); doctorPrimed = true; return; }
  for (const a of docs) {
    const k = `${a.startedAt}|${a.platform || ''}`;
    if (toasted.has(k)) continue;
    toasted.add(k);
    toast(doctorMsg(a, h), 4200);
  }
}
const dayStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const gainN = (p, n) => { const t = dayStr(new Date()), b = dayStr(new Date(Date.now() - n * 864e5)); return F[p] && F[p][t] != null && F[p][b] != null ? F[p][t] - F[p][b] : null; };
const latest = (p) => { const d = Object.keys(F[p] || {}).sort(); return d.length ? { day: d[d.length - 1], total: F[p][d[d.length - 1]], n: d.length } : null; };
const M = (e, p) => ((e.tasks.find(t => t.platform === p) || {}).m) || null;
const busy = () => O.actions.some(a => !a.done);
const abtn = (a, text, cls = '', cf = '', label = '') => `<button type="button"${label ? ` aria-label="${esc(label)}"` : ''} class="btn ${cls}" ${busy() && !['mark', 'login', 'toggle-platform'].includes(a.type) ? 'disabled' : ''} data-act='${esc(JSON.stringify(a))}' data-confirm="${esc(cf)}">${text}</button>`;
const tile = (lab, val, sub = '') => `<div class="panel tile"><div class="lab">${lab}</div><div class="val">${val}</div><div class="dl">${sub}</div></div>`;
const sec = (t, note = '') => `<div class="sec"><h2>${t}</h2><span class="note">${note}</span></div>`;
const epc = (x) => `<span class="epc">${x.covers.length ? `<img src="/cover?id=${encodeURIComponent(x.id)}&k=${x.covers.includes('4x3') ? '4x3' : x.covers[0]}&v=${x.coverVer || ''}" alt="">` : '<i></i>'}<span><b>${esc(x.nick)}</b><small>第 ${esc(x.episode)} 期 · ${when(x.schedule || x.createdAt).split(' ')[0]}</small></span></span>`;
const samplesOf = (e) => PL.map(p => ({ name: PN[p], pts: O.samples.filter(s => s.episode_id === e.id && s.platform === p && s.views != null).map(s => [Date.parse(s.ts + ':00Z'), s.views]) })).filter(s => s.pts.length).sort((a, b) => b.pts[b.pts.length - 1][1] - a.pts[a.pts.length - 1][1]);
let after = () => {};
let trafficPage = 0, trafficSource = 'projects', accountTraffic = null, trafficRequest = 0;

function vTraffic() {
  const hasAccounts = accountTraffic?.statuses?.length;
  const hasProjects = O.episodes.some(e => e.views > 1);
  const sources = hasAccounts && hasProjects ? `<div class="btns traffic-switch"><button type="button" class="btn" data-traffic-source="projects" aria-pressed="${trafficSource === 'projects'}">发布工程</button><button type="button" class="btn" data-traffic-source="account" aria-pressed="${trafficSource === 'account'}">账号作品</button></div>` : '';
  if (hasAccounts && (trafficSource === 'account' || !hasProjects)) return sources + vAccountTraffic();
  return sources + vProjectTraffic() + (accountTraffic?.error ? `<p class="note" role="status">账号流量暂不可用：${esc(accountTraffic.error)}</p>` : '');
}

function vAccountTraffic() {
  const { accounts, videos, statuses, history, direct, browser } = accountTraffic;
  const name = id => accounts.find(a => a.id === id)?.name || id;
  const platform = id => accounts.find(a => a.id === id)?.platform || id;
  const pageCount = Math.max(1, Math.ceil(videos.length / 50));
  trafficPage = Math.min(trafficPage, pageCount - 1);
  const rows = videos.slice(trafficPage * 50, (trafficPage + 1) * 50);
  const total = key => statuses.every(r => r.syncedAt) && videos.every(v => v[key] != null) ? sum(videos, key) : null;
  const lines = accounts.map(({ id, platform, name }) => ({ platform, name, pts: history.filter(h => h.platform === id && h.views != null).map(h => [Date.parse(h.day + 'T12:00:00+08:00'), h.views]) })).filter(s => s.pts.length > 1);
  after = () => { const el = $('#account-lines'); if (el) drawLines(el, lines); };
  const button = (action, label, css = '') => `<button type="button" class="btn ${css}" data-account-action='${esc(JSON.stringify(action))}' ${action.type === 'metricsAccounts' && busy() ? 'disabled' : ''}>${esc(label)}</button>`;
  const running = O.actions.some(a => a.type === 'metricsAccounts' && !a.done);
  const last = O.actions.find(a => a.type === 'metricsAccounts' && a.done);
  return `<div class="h1">流量</div><p class="lead">已发布的账号作品，与发布工程分开。失败时保留上次成功数据。</p>
  <div class="btns traffic-switch">${button({type:'metricsAccounts'}, running ? '采集中…' : '采集账号流量', 'pri')}${abtn({type:'followers'}, '采集粉丝')}${last && !last.ok ? `<span role="status">${esc(last.tail.trim().split('\n').at(-1) || '采集失败')}</span>` : ''}</div>
  <div class="grid g3">${tile('作品',fmt(videos.length))}${tile('累计播放',fmt(total('views')))}${tile('累计点赞',fmt(total('likes')))}</div>
  ${sec('账号')}<div class="panel"><div class="tw"><table><thead><tr><th>账号</th><th class="n">作品</th><th>上次成功</th><th>采集结果</th><th></th></tr></thead><tbody>${statuses.map(st => `<tr><td>${logo(platform(st.id))}${esc(name(st.id))}</td><td class="n">${fmt(st.count)}</td><td>${when(st.syncedAt) || '未采集'}</td><td role="status">${esc(st.error || (st.syncedAt ? '已采集' : '未采集'))}</td><td>${direct && browser !== 'ego' && st.id.startsWith('bilibili@') ? button({ type:'metricsLogin', id:st.id }, '打开登录页') : ''}</td></tr>`).join('')}</tbody></table></div></div>
  ${sec('作品')}<div class="panel"><div class="tw"><table><thead><tr><th>作品</th><th>账号</th><th>发布</th><th class="n">播放</th><th class="n">赞</th><th class="n">评论</th><th class="n">收藏</th><th class="n">转发</th></tr></thead><tbody>${rows.map(v => `<tr><td>${safeUrl(v.url) ? `<a href="${safeUrl(v.url)}" target="_blank" rel="noopener">${esc(v.title)}</a>` : esc(v.title)}</td><td>${esc(name(v.platform))}</td><td>${when(v.publishedAt).split(' ')[0] || '–'}</td>${['views','likes','comments','favorites','shares'].map(k => `<td class="n">${fmt(v[k])}</td>`).join('')}</tr>`).join('') || '<tr><td colspan="8">还没有作品数据。</td></tr>'}</tbody></table></div></div>
  ${pageCount > 1 ? `<div class="btns traffic-switch"><button type="button" class="btn" data-traffic-page="${trafficPage-1}" ${trafficPage === 0 ? 'disabled' : ''}>上一页</button><span>${trafficPage+1} / ${pageCount}</span><button type="button" class="btn" data-traffic-page="${trafficPage+1}" ${trafficPage === pageCount-1 ? 'disabled' : ''}>下一页</button></div>` : ''}
  ${lines.length ? `${sec('累计播放走势')}<div class="panel"><div class="chartbox" id="account-lines"></div></div>` : ''}
  ${sec('粉丝', '每天采一次')}<div class="panel"><div class="tw"><table><thead><tr><th>平台</th><th class="n">现在</th><th class="n">今日</th><th class="n">近 7 天</th><th class="n">近 30 天</th></tr></thead><tbody>${PL.map(p => { const l = latest(p); return l ? `<tr><td>${logo(p)}${esc(PN[p])}</td><td class="n"><b>${fmt(l.total)}</b></td>${[1,7,30].map(n => `<td class="n">${gainN(p,n) == null ? '–' : sgn(gainN(p,n))}</td>`).join('')}</tr>` : ''; }).join('')}</tbody></table></div></div>`;
}

function vProjectTraffic() {
  const eps = O.episodes.filter(e => e.views > 1); if (!eps.length) return `<div class="h1">流量</div><p class="lead">还没采到流量。</p>${abtn({ type: 'metrics' }, '现在采一次', 'pri')}`;
  const all = sum(eps, 'views'), it = sum(eps, 'inter'), byP = PL.map(p => ({ p, v: eps.reduce((s, e) => s + ((M(e, p) || {}).views || 0), 0) })).sort((a, b) => b.v - a.v);
  const e = eps.find(x => x.id === pick) || eps[0], rows = PL.map(p => ({ p, m: M(e, p), t: e.tasks.find(t => t.platform === p) })).filter(r => r.m), mx = Math.max(...rows.map(r => r.m.views || 0), 1);
  after = () => { const el = $('#c-line'); if (el) drawLines(el, samplesOf(e)); };
  return `<div class="h1">流量</div><p class="lead">每一期在每个平台的播放和互动。每天上午采一次；新发的一期头三天每 6 小时采一次。</p>
  <div class="grid g4">${tile('累计播放', fmt(all), `${eps.length} 期合计`)}${tile('累计互动', fmt(it), `互动率 ${pct(it, all, 1)}`)}${tile('平均每期播放', fmt(all / eps.length))}${tile('播放最多的平台', PN[byP[0].p], `${fmt(byP[0].v)}，占 ${pct(byP[0].v, all)}`)}</div>
  ${sec('每期 × 平台', '格子里是播放数，细条是这一期里的占比')}
  <div class="panel"><div class="tw"><table><thead><tr><th>期</th>${PL.map(p => `<th class="n">${logo(p)}${PN[p]}</th>`).join('')}<th class="n">合计</th><th class="n">互动率</th></tr></thead><tbody>
    ${eps.map(x => { const m2 = Math.max(...PL.map(p => (M(x, p) || {}).views || 0), 1); return `<tr><td><a href="#/ep/${encodeURIComponent(x.id)}" title="${esc(x.name)}">${epc(x)}</a></td>${PL.map(p => { const m = M(x, p); return `<td class="n">${m ? fmt(m.views) : '–'}<span class="cellbar"><i style="width:${m ? (m.views / m2 * 100).toFixed(0) : 0}%"></i></span></td>`; }).join('')}<td class="n"><b>${fmt(x.views)}</b></td><td class="n">${pct(x.inter, x.views, 1)}</td></tr>`; }).join('')}</tbody></table></div></div>
  ${sec(`${esc(e.nick)} · 各平台明细`, eps.length > 1 ? eps.map(x => `<a href="#/traffic" data-pick="${esc(x.id)}" style="margin-left:12px;${x.id === e.id ? 'color:var(--accent);font-weight:600' : ''}" title="${esc(x.name)}">${esc(x.nick)}</a>`).join('') : '')}
  <div class="panel"><div class="tw"><table><thead><tr><th>平台</th><th class="n">播放</th><th class="n">赞</th><th class="n">评论</th><th class="n">收藏</th><th class="n">转发</th><th class="n">互动率</th><th class="n">收藏率</th><th></th></tr></thead><tbody>
    ${rows.sort((a, b) => b.m.views - a.m.views).map(r => { const u = safeUrl(r.t && r.t.url); return `<tr><td>${logo(r.p)}${PN[r.p]}</td><td class="n"><b>${fmt(r.m.views)}</b><span class="cellbar"><i style="width:${(r.m.views / mx * 100).toFixed(0)}%"></i></span></td><td class="n">${fmt(r.m.likes)}</td><td class="n">${fmt(r.m.comments)}</td><td class="n">${fmt(r.m.favorites)}</td><td class="n">${fmt(r.m.shares)}</td><td class="n">${r.m.views ? pct(inter(r.m), r.m.views, 1) : '–'}</td><td class="n">${r.m.views && r.m.favorites != null ? pct(r.m.favorites, r.m.views, 1) : '–'}</td><td class="n">${u ? `<a href="${u}" target="_blank" rel="noopener">打开 ↗</a>` : ''}</td></tr>`; }).join('')}</tbody></table></div></div>
  ${sec(`${esc(e.nick)} · 播放走势`, '每次采样一个点')}<div class="panel"><div class="chartbox" id="c-line"></div></div>
  ${sec('粉丝', '每天采一次')}
  <div class="panel"><div class="tw"><table><thead><tr><th>平台</th><th class="n">现在</th><th class="n">今日</th><th class="n">近 7 天</th><th class="n">近 30 天</th><th class="n">已记录</th></tr></thead><tbody>
    ${PL.map(p => { const l = latest(p); const g = (n) => { const v = gainN(p, n); return v == null ? '<span style="color:var(--t3)">–</span>' : sgn(v); }; return l ? `<tr><td>${logo(p)}${PN[p]}</td><td class="n"><b>${fmt(l.total)}</b></td><td class="n">${g(1)}</td><td class="n">${g(7)}</td><td class="n">${g(30)}</td><td class="n">${l.n} 天</td></tr>` : ''; }).join('')}</tbody></table></div></div>
  <div class="btns" style="margin-top:18px">${abtn({ type: 'metrics' }, '现在采一次流量')}${abtn({ type: 'followers' }, '现在采一次粉丝')}</div>`;
}

function vConvert() {
  if (O.siteSalesOnly) return vSales();
  if (!O.siteOn) return `<div class="h1">转化</div><p class="lead">还没接你自己的站点。</p>
  <div class="panel" style="padding:18px 20px;line-height:1.8;font-size:14px;color:var(--t2)">
    <p style="margin:0 0 10px">有课程站、会员站或者自己的产品，就能在这里看到：哪一期、哪个平台带来了注册和付费，每期一条「播放 → 注册 → 会员 → 收入」的漏斗。</p>
    <p style="margin:0">接入方法：在 <code>config.json</code> 里配 <code>site</code>，站点提供两个只读接口，格式见 <code>src/site.mjs</code> 顶部注释；想按期看转化，站点还要记下访客第一次带来的 <code>utm_campaign</code>。</p>
    ${O.learn ? `<p style="margin:12px 0 0">作者自己的站点怎么接、每期转化怎么看，会在会员直播课里完整讲一遍：<a href="${esc(O.learn)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:600">去知识站看看 ›</a></p>` : ''}
  </div>`;
  const d = O.site.days, ch = O.site.channels;
  if (!d.length) return `<div class="h1">转化</div><p class="lead">还没同步${esc(PN.zsz)}数据。</p>${abtn({ type: 'board' }, '现在同步', 'pri')}`;
  const l7 = d.slice(-7), p7 = d.slice(-14, -7), tr = sum(ch, 'reg') || 1, mr = Math.max(...ch.map(c => c.revenue), 1);
  after = () => { drawCols($('#c-reg'), d.map(r => ({ x: r.day.slice(5), y: r.reg || 0 }))); drawCols($('#c-rev'), d.map(r => ({ x: r.day.slice(5), y: r.revenue || 0 })), '¥'); };
  return `<div class="h1">转化</div><p class="lead">${esc(PN.zsz)}的注册、会员和收入，以及它们从哪来。</p>
  <div class="grid g4">${tile('近 7 天 · 新注册', fmt(sum(l7, 'reg')), delta(sum(l7, 'reg'), sum(p7, 'reg')))}${tile('近 7 天 · 新会员', fmt(sum(l7, 'vip')), delta(sum(l7, 'vip'), sum(p7, 'vip')))}${tile('近 7 天 · 订单', fmt(sum(l7, 'orders')), delta(sum(l7, 'orders'), sum(p7, 'orders')))}${tile('近 7 天 · 收入', '¥' + fmt(sum(l7, 'revenue')), delta(sum(l7, 'revenue'), sum(p7, 'revenue')))}</div>
  <div class="grid g2" style="margin-top:var(--gap)"><div class="panel"><div class="ph"><h3>每日新注册</h3><span class="note">近 ${d.length} 天共 ${fmt(sum(d, 'reg'))} 人</span></div><div class="chartbox" id="c-reg"></div></div>
    <div class="panel"><div class="ph"><h3>每日收入</h3><span class="note">近 ${d.length} 天共 ¥${fmt(sum(d, 'revenue'))}，${fmt(sum(d, 'orders'))} 笔</span></div><div class="chartbox" id="c-rev"></div></div></div>
  ${sec('渠道', '累计，按注册时自己填的来源')}
  <div class="panel"><div class="tw">${ch.length ? `<table><thead><tr><th>渠道</th><th class="n">注册</th><th class="n">占比</th><th class="n">会员</th><th class="n">转会员</th><th class="n">订单</th><th class="n">收入</th><th class="n">每注册收入</th></tr></thead><tbody>
    ${ch.map(c => `<tr><td>${esc(c.label || c.source)}</td><td class="n">${fmt(c.reg)}</td><td class="n">${pct(c.reg, tr)}</td><td class="n">${fmt(c.vip)}</td><td class="n">${c.reg ? pct(c.vip, c.reg, 1) : '–'}</td><td class="n">${fmt(c.orders)}</td><td class="n"><b>¥${fmt(c.revenue)}</b><span class="cellbar"><i style="width:${(c.revenue / mr * 100).toFixed(0)}%"></i></span></td><td class="n">${c.reg ? '¥' + (c.revenue / c.reg).toFixed(1) : '–'}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">还没有渠道数据</div>'}</div></div>
  ${sec('每期转化漏斗', '播放 → 注册 → 会员 → 收入，按访客第一次点进来的链接归到期')}
  <div class="panel">${O.site.campaignsOn && O.site.campaigns.length ? (() => { const rows = O.site.campaigns.map(c => ({ c, e: O.episodes.find(e => e.campaign === c.campaign) })), mx = Math.max(...rows.map(r => r.e ? r.e.views : 0), 1);
      const bar = (v, m, col) => `<span class="fnl"><i style="width:${Math.max(2, v / m * 100).toFixed(1)}%;background:${col}"></i></span>`;
      return `<div class="tw"><table><thead><tr><th>期</th><th class="n">播放</th><th class="n">注册</th><th class="n">每万播放注册</th><th class="n">会员</th><th class="n">注册→会员</th><th class="n">收入</th><th class="n">每千播放收入</th></tr></thead><tbody>${rows.map(({ c, e }) => { const v = e ? e.views : 0;
        return `<tr><td>${e ? `<a href="#/ep/${encodeURIComponent(e.id)}" title="${esc(e.name)}">${epc(e)}</a>` : esc(c.campaign)}<div style="font-size:11.5px;color:var(--t3)">来自 ${esc(c.sources || '–')}</div></td><td class="n">${v ? fmt(v) : '–'}${bar(v, mx, 'var(--accent)')}</td><td class="n"><b>${fmt(c.reg)}</b></td><td class="n">${v ? (c.reg / v * 1e4).toFixed(1) : '–'}</td><td class="n">${fmt(c.vip)}</td><td class="n">${c.reg ? pct(c.vip, c.reg, 1) : '–'}</td><td class="n"><b>¥${fmt(c.revenue)}</b></td><td class="n">${v ? '¥' + (c.revenue / v * 1e3).toFixed(1) : '–'}</td></tr>`; }).join('')}</tbody></table></div>`; })()
    : `<p style="margin:0;color:var(--t2);font-size:13.5px;line-height:1.7">${O.site.campaignsOn ? '已经开始按期记录，还没有人通过视频里的链接注册。' : `现在只能看到哪个渠道带来注册和收入，看不到是哪一期带来的。让${esc(PN.zsz)}记下访客第一次带来的 <code>utm_campaign</code>，并在 dashboardApi 里返回 <code>campaignStats</code>，这里就会出现每期的转化漏斗（见 README「接入你自己的站点」）。`}</p>`}</div>
  <div class="btns" style="margin-top:18px">${abtn({ type: 'board' }, `现在同步${esc(PN.zsz)}数据`)}</div>`;
}

const salesMoney = n => n == null ? '–' : '¥' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const salesTotal = (rows, key) => rows.length && rows.every(r => r[key] != null && Number.isFinite(r[key])) ? rows.reduce((n, r) => n + Math.round(r[key] * 100), 0) / 100 : null;
function vSales() {
  const s = O.site.sales;
  if (!s) return vSalesLegacy();
  const trend = s.trend || [], sync = abtn({ type: 'board' }, `同步${esc(PN.zsz)}数据`, 'pri');

function vCalendar() {
  // 日历：上周、这周、下两周，每天列出这天发的期（已发布 / 已定时 / 等你点 / 计划中）
  const DAY = 864e5, now = new Date(), dow = (now.getDay() + 6) % 7, mon0 = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow - 7);
  const days = Array.from({ length: 28 }, (_, i) => new Date(mon0.getTime() + i * DAY)), key = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  // 还在等你点发布的平台（比如公众号单独发的那一家）不跟着整期走，单独落在今天，所以期卡片只统计其余平台
  const PEND = ['awaiting_user', 'filled'];
  const st = (e) => { const live = e.tasks.filter(t => !PEND.includes(t.state)), s = live.map(t => t.state), todoN = e.tasks.length - live.length; if (!live.length) return ['todo', '等你点发布']; return s.some(x => ['failed', 'not_logged_in'].includes(x)) ? ['bad', '异常'] : s.every(x => x === 'published' || x === 'skipped') ? (todoN ? ['ok', `已发 ${s.filter(x => x === 'published').length}/${e.tasks.length} 家`] : ['ok', '已发布']) : s.some(x => x === 'published') ? ['ok', '已发 · 部分待发'] : s.some(x => x === 'planned') ? ['plan', '计划中'] : ['sch', '已定时']; };
  const today = key(now);
  const by = {}; for (const e of O.episodes) { const d = new Date(e.publishAt || e.schedule || e.createdAt); (by[key(d)] ||= []).push(e); }
  // 平台级落格：等发布的放今天；已发布但不在期锚点那天的平台（比如公众号隔天单独发），按它自己的发布时间单独落一天
  const whenMs = (s) => { if (!s) return NaN; const x = String(s).replace(' ', 'T'); return Date.parse(x); };
  for (const e of O.episodes) {
    const aK = key(new Date(e.publishAt || e.schedule || e.createdAt));
    for (const t of e.tasks) {
      const ms = whenMs(t.publishedAt);
      if (PEND.includes(t.state)) { (by[today] ||= []).push({ ...e, __solo: t }); continue; }
      if (t.state === 'published' && Number.isFinite(ms)) { const k = key(new Date(ms)); if (k !== aK) (by[k] ||= []).push({ ...e, __solo: t }); }
    }
  }
  const upcoming = O.episodes.filter(e => e.schedule && Date.parse(e.schedule) > Date.now()).length;
  return `<div class="h1">日历</div><p class="lead">上周到未来两周的分发安排。${upcoming ? `接下来还有 <b>${upcoming}</b> 期要发。` : '接下来没有排期，可以用 <code>hub plan</code> 把下一期放进来。'}</p>
  <div class="panel cal"><div class="cal-h">${'一二三四五六日'.split('').map(x => `<div>周${x}</div>`).join('')}</div><div class="cal-g">${days.map(d => { const k = key(d), list = by[k] || [];
    return `<div class="cal-d${k === today ? ' today' : ''}${d < new Date(now.getFullYear(), now.getMonth(), now.getDate()) ? ' past' : ''}"><div class="cal-n">${d.getDate() === 1 || d === days[0] ? `${d.getMonth() + 1}/` : ''}${d.getDate()}${k === today ? '<span>今天</span>' : ''}</div>
      ${list.map(e => { const img = e.covers.length ? `<img src="/cover?id=${encodeURIComponent(e.id)}&k=${e.covers.includes('3x4') ? '3x4' : e.covers[0]}&v=${e.coverVer || ''}" alt="">` : ''; if (e.__solo) { const sv = e.__solo, pend = PEND.includes(sv.state), ms = whenMs(sv.publishedAt), at = Number.isFinite(ms) ? new Date(ms) : null, label = pend ? sv.name : (sv.publishedTitle || sv.title || sv.name); return `<a class="cal-e ${pend ? 'todo' : 'ok'}" href="#/ep/${encodeURIComponent(e.id)}" title="${esc(e.name)} · ${esc(label)}">${img}<div><b>${esc(label)}</b><span><i></i>${pend ? '等你点发布' : `${esc(sv.name)} · ${at ? pad(at.getHours()) + ':' + pad(at.getMinutes()) + ' · ' : ''}已发布`}</span></div></a>`; } const [c, t] = st(e), at = new Date(e.publishAt || e.schedule || e.createdAt);
        const pts = e.tasks.filter(x => x.state === 'published' && Number.isFinite(whenMs(x.publishedAt))).map(x => ({ p: PN[x.platform] || x.name, ms: whenMs(x.publishedAt) })).sort((a, b) => a.ms - b.ms);
        const hm = (ms) => { const d2 = new Date(ms); return pad(d2.getHours()) + ':' + pad(d2.getMinutes()); };
        const spanT = pts.length > 1 && hm(pts[0].ms) !== hm(pts[pts.length - 1].ms) ? hm(pts[0].ms) + '–' + hm(pts[pts.length - 1].ms) : pad(at.getHours()) + ':' + pad(at.getMinutes());
        const tip = pts.map(x => x.p + ' ' + hm(x.ms)).join(' / ');
        return `<a class="cal-e ${c}" href="#/ep/${encodeURIComponent(e.id)}" title="${esc(e.name)}${tip ? ' · ' + esc(tip) : ''}">${img}<div><b>${esc(e.nick)}</b><span><i></i>${spanT} · ${t}${e.views > 1 ? ' · ' + fmt(e.views) : ''}</span></div></a>`; }).join('')}</div>`; }).join('')}</div></div>
  <div class="cal-lg"><span><i class="ok"></i>已发布</span><span><i class="sch"></i>已定时</span><span><i class="todo"></i>等你点发布</span><span><i class="plan"></i>计划中</span><span><i class="bad"></i>异常</span></div>`;
}

    dashboardApi: $('#site-dashboardApi')?.value, coursePath: $('#site-coursePath')?.value,
    logo: $('#site-logo')?.value ?? '',
  };
}
function captureFsDraft() { const el = $('#fs-webhook'); if (el) fsDraft = el.value; }
const siteVals = () => { const s = itg().site, d = siteDraft || {}; return {
  name: d.name ?? s.name ?? '', base: d.base ?? s.base ?? '', adminPath: d.adminPath ?? s.adminPath ?? '',
  coursesApi: d.coursesApi ?? s.coursesApi ?? '', dashboardApi: d.dashboardApi ?? s.dashboardApi ?? '',
  coursePath: d.coursePath ?? s.coursePath ?? '', logo: d.logo ?? s.logo ?? '',
}; };
function siteFormIntegration() {
  const current = itg();
  return siteOpening ? { ...current, site: { ...current.site, enabled: true } } : current;
}
const siteBody = (itg = siteFormIntegration) => {
  const s = itg().site, v = siteVals();
  if (s.salesOnly) return `<div class="site-off">${esc(s.shopName)} · ${s.enabled ? '已启用小鹅通销售同步' : '销售同步已停用'}</div>${s.enabled ? '<button type="button" class="btn" data-site="test">测试连接</button>' : ''}`;
  if (!s.enabled) return '<div class="site-off">未启用 · 打开后填写站点配置；停用期间转化页、建课和站点数据同步都会关闭。</div>';
  const field = (id, lab, val) => `<label class="lab" for="${id}">${lab}</label><input class="inp" id="${id}" value="${esc(val || '')}">`;
  return `<div class="istate" id="site-state">${siteState(s)}</div>
  ${field('site-name', '站名', v.name)}${field('site-base', '站点地址', v.base)}
  <details><summary>接口路径（默认值一般不用改）</summary><div class="grid2" style="margin-top:10px">
    ${field('site-adminPath', '后台路径', v.adminPath)}${field('site-coursesApi', '课程接口', v.coursesApi)}${field('site-dashboardApi', '仪表盘接口', v.dashboardApi)}${field('site-coursePath', '课程页路径', v.coursePath)}
  </div></details>
  ${field('site-logo', '站点图标（本机路径，可选）', v.logo)}
  <div class="btns"><button type="button" class="btn pri" data-site="test">测试连接</button><button type="button" class="btn" data-site="save" aria-label="保存站点设置">保存</button></div>`;
};
function paintFs() {
  const el = $('#fs-state'); if (el) el.innerHTML = fsState(itg().feishu);
  const wh = $('#fs-webhook'); if (wh && fsDraft != null) wh.value = fsDraft;
  const cb = $('#fs-login'); if (cb) { cb.checked = !!itg().feishu.login; cb.disabled = !feishuConfigured(); }
}
function paintSiteBody() { const el = $('#site-body'); if (el) el.innerHTML = siteBody(); const on = $('#site-on'); if (on) on.checked = !!(itg().site.enabled || siteOpening); }
// 停用态表单没渲染，输入框不存在时回退到草稿 / 已保存的值，避免「关掉再打开」或测试后把配置清空
const siteFields = () => { captureSiteDraft(); const s = itg().site, v = siteVals(); return { enabled: $('#site-on')?.checked ?? !!s.enabled, ...v }; };

async function postJson(url, fields) {
  const response = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(fields) });
  const result = await response.json().catch(() => null);
  if (!response.ok || !result) throw new Error(result?.error || '操作失败');
  return result;
}
function feishuFields() {
  const webhook = $('#fs-webhook').value.trim();
  return webhook ? { webhook } : {};
}
async function saveFeishu(login) {
  const fields = feishuFields();
  const previous = itg().feishu;
  if (!('webhook' in fields) && previous.configured == null && previous.webhook) {
    fields.webhook = previous.webhook;  // An old server interprets omission as deletion.
  }
  I.feishu = (await postJson('/api/integrations/feishu', { ...fields, login })).feishu;
  fsDraft = null;
  if ($('#fs-webhook')) $('#fs-webhook').value = '';
  paintFs();
}
async function saveSite(fields) {
  I.site = (await postJson('/api/integrations/site', fields)).site;
  siteDraft = null;
  siteOpening = false;
  paintSiteBody();
  await load();
}

function platformRow(p) {
  const name = p.name || PN[p.id] || p.id;
  const [style, icon, state] = p.disabled ? ['off', '–', '已停用'] : p.state === 'ok' ? ['published', '✓', '已登录'] : p.state === 'out' ? ['not_logged_in', '✕', '未登录'] : ['idle', '?', '未检查'];
  const note = p.disabled ? '停用期间暂停体检和账号数据采集' : p.reason || (p.day ? `上次检查 ${p.day}` : '还没检查过');
  const login = p.state === 'ok' ? '打开后台' : '去登录';
  const toggle = p.disabled ? '启用' : '停用';
  // An account ID is not accepted by the publisher's base-platform actions.
  const canAct = !p.id.includes('@');
  return `<div class="prow pl-row${p.disabled ? ' off' : ''}">${logo(p.id)}<span class="pl-name">${esc(name)}<small class="pl-sub">${esc(note)}</small></span>
    <span class="st-chip ${style}"><i>${icon}</i>${state}</span>
    ${p.disabled || !canAct ? '' : abtn({type:'doctor', platform:p.id}, '检查', '', '', '检查' + name) + abtn({type:'login', platform:p.id}, login, 'pl-login', '', login + ' · ' + name)}
    ${canAct ? abtn({type:'toggle-platform', platform:p.id, on:p.disabled}, toggle, '', p.disabled ? '' : `停用${name}？`, toggle + name) : ''}</div>`;
}

function vSystem() {
  const h = O.health, today = new Date().toLocaleDateString('zh-CN', { timeZone: 'Asia/Shanghai' }), cur = O.episodes?.[0], ps = h.platforms || [];
  const browser = h.browser || { name: '专用浏览器', status: h.chrome ? '在线' : '没开' };
  const dates = ps.filter(p => !p.disabled && p.day).map(p => p.day);
  const lastCheck = dates.sort((a, b) => a.localeCompare(b, 'zh-CN', { numeric: true })).at(-1);
  return `<div class="h1">系统</div><p class="lead">麦田的运行情况与账号设置。</p>
  <div class="grid g4">${tile('守护进程', '运行中', '开机自启，崩溃自动拉起')}${tile('NAS', h.nas ? '已挂载' : '读不到', h.nas ? '工程目录可读' : '取链接和封面会失败')}${tile(browser.name, browser.status, '各平台的登录都在这里')}${tile('平台登录', platformSummary(h), lastCheck ? `最近检查 ${esc(lastCheck)}${lastCheck === today ? '（今天）' : ''}` : '点击「检查」可查看账号登录状态')}</div>
  ${sec('平台', '登录、体检和常用操作；扫码要人在这台电脑前')}
  <div class="panel"><div class="btns" style="margin-bottom:4px">${abtn({ type: 'doctor' }, '全部检查', 'pri')}${abtn({ type: 'login' }, '打开全部登录页')}${cur ? abtn({ type: 'sync', id: cur.id }, `取「${esc(cur.nick)}」的链接`) : ''}${abtn({ type: 'metrics' }, '采流量')}${abtn({ type: 'followers' }, '采粉丝')}</div>
    ${ps.map(platformRow).join('') || '<div class="empty">没有平台</div>'}</div>
  ${S ? `<details id="account-settings" class="panel settings-panel" ${settingsDirty ? 'open' : ''}><summary>B站账号设置</summary>${settingsHTML(S)}</details>` : ''}
  ${sec('集成')}
  <div class="sys-2col sys-itg">
    <div class="panel">
      <div class="ph"><h3>飞书</h3><span class="note" id="fs-state" role="status">${fsState(itg().feishu)}</span></div>
      <label class="lab" for="fs-webhook">群机器人 webhook</label>
      <input class="inp" id="fs-webhook" type="password" autocomplete="off" placeholder="${feishuConfigured() ? '已配置，留空沿用原地址' : 'https://open.feishu.cn/open-apis/bot/v2/hook/…'}">
      <div class="btns"><button type="button" class="btn pri" data-fs="test">测试发送</button><button type="button" class="btn" data-fs="save" aria-label="保存飞书设置">保存</button></div>
      <label class="swrow"><input type="checkbox" class="switch" id="fs-login" ${itg().feishu.login ? 'checked' : ''} ${feishuConfigured() ? '' : 'disabled'}><span>用飞书验证码登录 <small>远程打开时推 6 位验证码，替代网页口令</small></span></label>
    </div>
    <div class="panel">
      <div class="ph"><h3>知识站</h3><label class="swrow alone"><input type="checkbox" class="switch" id="site-on" aria-label="启用知识站集成" ${itg().site.enabled || siteOpening ? 'checked' : ''}></label></div>
      <div id="site-body">${siteBody()}</div>
    </div>
  </div>
  ${O.siteOn ? `${sec('收入来源')}<div class="panel"><div class="btns">${abtn({ type: 'board' }, `同步${esc(O.siteName || '知识站')}数据`)}</div></div>` : ''}
  ${O.actions?.length ? `<div class="panel system-actions"><h3>操作记录</h3>${O.actions.map(a => `<div class="prow"><span>${esc(a.label)}</span><span>${a.done ? (a.ok ? '完成' : '出错') : '进行中'}</span>${a.done && !a.ok ? `<span class="d">${esc(a.tail)}</span>` : ''}</div>`).join('')}</div>` : ''}
  <div class="sys-2col">
    <div class="panel sys-tasks">
      <div class="ph"><h3>自动任务</h3></div>
      <div class="sys-scroll"><dl class="kv"><dt>每 5 分钟</dt><dd>检查有没有到点要取链接的期数，提醒还没点发布的平台</dd>${Object.keys(h.login || {}).length ? '<dt>每小时</dt><dd>启用账号登录保活</dd>' : ''}<dt>每天 9 点后</dt><dd>体检一次，有平台掉线才通知（上次：${esc(h.doctorDay || '还没做')}）</dd><dt>每天 10 点后</dt><dd>采流量和粉丝，发飞书日报（上次：${esc(h.metricsDay || '还没采')}）</dd><dt>新一期发布后</dt><dd>头 72 小时每 6 小时采一次流量</dd></dl></div>
    </div>
    <div class="panel sys-feed">
      <div class="ph"><h3>最近动态</h3></div>
      <div class="sys-scroll">${O.feed.map(f => `<div class="fd"><span class="tm">${when(f.ts).split(' ')[1]}</span><span class="ep">${f.nick ? esc(f.nick) : '<span class="plat-tag">平台</span>'}</span><span>${esc(f.platform)}</span><span class="rs">${esc(f.action)}${f.result ? ' · ' + esc(f.result) : ''}</span></div>`).join('') || '<div class="empty" style="height:60px">还没有动态</div>'}</div>
    </div>
  </div>`;
}

async function render(forceSettingsRender = false) {
  captureSiteDraft(); captureFsDraft();
  const h = location.hash || '#/traffic', key = h.startsWith('#/ep/') ? 'archive' : h.slice(2).split('/')[0], app = $('#app'); after = () => {};
  if (!O || (settingsDirty && key === 'system' && $('#settings-form') && !forceSettingsRender)) return;
  let body;
  try {
    if (key === 'system') {
      if (!settingsDirty) {
        const settings = await api('/api/bilibili-accounts').catch(() => null);
        if (!settingsDirty) S = Array.isArray(settings?.bilibiliAccounts) ? settings : null;
      }
    }
    body = h.startsWith('#/ep/') ? await vEpisode(decodeURIComponent(h.slice(5))) : ({ traffic: vTraffic, calendar: vCalendar, convert: vConvert, archive: vArchive, system: vSystem }[key] || vTraffic)();
  } catch (e) { body = `<div class="empty" style="height:40vh">出错了：${esc(e.message)}</div>`; }
  if (h !== (location.hash || '#/traffic')) return;
  if (settingsDirty && key === 'system' && $('#settings-form') && !forceSettingsRender) return;
  const visibleForm = $('#settings-form');
  if (key !== 'system' && settingsDirty && visibleForm) S = { ...S, ...readSettings(visibleForm) };
  const accountSettingsOpen = key === 'system' && $('#account-settings')?.open;
  app.innerHTML = topbar(O, key) + body;
  if (accountSettingsOpen && $('#account-settings')) $('#account-settings').open = true;
  after();
  if (fsDraft != null) { const wh = $('#fs-webhook'); if (wh) wh.value = fsDraft; }
}
async function load() {
  try { captureSiteDraft(); captureFsDraft(); O = await api('/api/overview'); I = await api('/api/integrations').catch(() => null); const off = new Set((O.health.platforms || []).filter(p => p.disabled).map(p => p.id)); if (!(O.health.platforms || []).some(p => p.id === 'wechat')) off.add('wechat'); PL = PL_ALL.filter(p => !off.has(p) && ((O.siteOn && !O.siteSalesOnly) || p !== 'zsz')); if (O.siteOn) { if (O.siteName) PN.zsz = O.siteName; if (O.siteLogo) LOGO.zsz = { img: '/site-logo' }; } F = {}; for (const r of O.followers) (F[r.platform] ||= {})[r.day] = r.total; noteDoctorDone(O.health); await render(); }
  catch (e) { if (!O) $('#app').innerHTML = `<div class="empty" style="height:60vh">连不上麦田服务（${esc(e.message)}）</div>`; }
  await refreshAccountTraffic();
}
async function refreshAccountTraffic() {
  if (!O || (location.hash && location.hash !== '#/traffic')) return;
  const id = ++trafficRequest;
  const latest = await api('/api/account-traffic').catch(e => ({ error: e.message }));
  if (id !== trafficRequest || (location.hash && location.hash !== '#/traffic')) return;
  accountTraffic = latest;
  await render();
}
function poll() { clearInterval(timer); timer = setInterval(async () => { await load(); if (!busy()) { clearInterval(timer); timer = null; } }, 4000); }
document.addEventListener('input', (e) => { if (e.target.closest?.('#settings-form')) settingsDirty = true; });
document.addEventListener('change', (e) => { if (e.target.closest?.('#settings-form')) settingsDirty = true; });
document.addEventListener('submit', async (e) => {
  if (e.target.id !== 'settings-form') return; e.preventDefault();
  const form = e.target, button = form.querySelector('[type="submit"]'), status = $('#settings-message'); button.disabled = true;
  try {
    await postJson('/api/bilibili-accounts', { action: 'replace', ...readSettings(form) });
    settingsDirty = false;
    await load();
    toast('已保存');
  } catch (err) { status.textContent = err.message; }
  finally { button.disabled = false; }
});
document.addEventListener('click', async (e) => {
  const ab = e.target.closest('[data-account-action]');
  if (ab) {
    ab.disabled = true;
    try {
      const r = await fetch('/api/account-traffic', { method:'POST', headers:{'content-type':'application/json'}, body:ab.dataset.accountAction });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { toast(j.error || '没成功'); return; }
      toast('已开始，跑完会自动刷新');
      await load(); poll();
    } catch (err) { toast(err.message || '没成功'); }
    finally { ab.disabled = false; }
    return;
  }
  const ts = e.target.closest('[data-traffic-source]'); if (ts) { trafficSource = ts.dataset.trafficSource; await render(); return; }
  const tp = e.target.closest('[data-traffic-page]'); if (tp) { trafficPage = Math.max(0, Number(tp.dataset.trafficPage) || 0); await render(); return; }
  const pk = e.target.closest('[data-pick]'); if (pk) { e.preventDefault(); pick = pk.dataset.pick; render(); return; }
  const form = $('#settings-form');
  if (form && e.target.closest('[data-add-account]')) { S = { ...S, ...readSettings(form) }; S.bilibiliAccounts.push({ id: '', name: '', uid: '', enabled: true }); settingsDirty = true; await render(true); $('#settings-form [data-account]:last-child [name="accountName"]')?.focus(); return; }
  const rm = e.target.closest('[data-remove-account]'); if (form && rm) { S = { ...S, ...readSettings(form) }; if (S.bilibiliAccounts[+rm.dataset.removeAccount].id !== 'default') S.bilibiliAccounts.splice(+rm.dataset.removeAccount, 1); settingsDirty = true; await render(true); return; }
  const control = e.target.closest('[data-fs]') || e.target.closest('[data-site]');
  if (control) {
    I ||= { feishu: {}, site: {} };
    control.disabled = true;
    try {
      if (control.dataset.fs === 'test') {
        const result = await postJson('/api/integrations/feishu/test', feishuFields());
        I.feishu.lastTest = { ...result, ts: new Date().toISOString() };
        paintFs();
        toast(result.ok ? '已发送，去飞书看看' : result.error || '发送失败');
      } else if (control.dataset.fs === 'save') {
        await saveFeishu($('#fs-login').checked);
        toast('已保存');
      } else {
        const fields = siteFields();
        if (control.dataset.site === 'save' && fields.enabled && !fields.base.trim()) throw new Error('先填站点地址');
        if (control.dataset.site === 'test') {
          const result = await postJson('/api/integrations/site/test', fields);
          I.site.lastTest = { ok: result.ok, error: result.error, ts: new Date().toISOString() };
          if (result.summary) I.site.summary = result.summary;
          const state = $('#site-state');
          if (state) state.innerHTML = siteState(I.site);
          toast(result.ok ? '连接正常' : result.error || '连不上');
        } else {
          await saveSite(fields);
          toast('已保存');
        }
      }
    } catch (err) { toast(err.message); }
    finally { control.disabled = false; }
    return;
  }
  const b = e.target.closest('[data-act]'); if (!b) return; const a = JSON.parse(b.dataset.act);
  if ((a.accountId || a.type === 'toggle-platform') && settingsDirty) { toast('先保存账号设置'); return; }
  if (b.dataset.confirm && !confirm(b.dataset.confirm)) return;
  b.disabled = true;
  try {
    if (a.type === 'toggle-platform') {
      await postJson('/api/platform-toggle', { platform: a.platform, on: a.on });
      toast(a.on ? '已启用' : '已停用');
      await load();
      return;
    }
    await postJson('/api/action', a);
    toast(a.type === 'doctor' ? (a.platform ? `开始检查${PN[a.platform] || a.platform}…` : '开始全部检查…') : '已开始，跑完会自动刷新');
    await load(); poll();
  } catch (err) { toast(err.message); }
  finally { b.disabled = false; }
});
document.addEventListener('change', async (e) => {
  if (!I || !['fs-login', 'site-on'].includes(e.target.id)) return;
  if (e.target.id === 'fs-login') {
    e.target.disabled = true;
    try { await saveFeishu(e.target.checked); toast(I.feishu.login ? '已开启验证码登录' : '已关闭验证码登录'); }
    catch (err) { toast(err.message); paintFs(); }
    return;
  }
  const enabled = e.target.checked;
  if (!I.site.base && (enabled || siteOpening)) {
    siteOpening = enabled;
    captureSiteDraft();
    paintSiteBody();
    if (enabled) $('#site-base')?.focus();
    return;
  }
  e.target.disabled = true;
  try {
    await saveSite({ enabled });
    toast(enabled ? '已启用' : '已停用');
  } catch (err) { toast(err.message); e.target.checked = I.site.enabled; }
  finally { e.target.disabled = false; }
});
addEventListener('hashchange', () => { if (!location.hash || location.hash === '#/traffic') load(); else render(); scrollTo(0, 0); });
addEventListener('resize', () => after());
load(); setInterval(() => { if (!timer && !document.hidden && !document.querySelector('details[open]')) load(); }, 60000);
</script>
